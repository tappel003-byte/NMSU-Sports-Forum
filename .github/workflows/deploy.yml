name: CI and deploy

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx vite build

  # Deploys main to Cloudflare once the technical owner has added the repository
  # secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID (see docs/DEPLOYMENT.md).
  # Skipped until then.
  deploy:
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      BOOTSTRAP_TOKEN: ${{ secrets.BOOTSTRAP_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Skip when Cloudflare is not configured
        id: configured
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Cloudflare deployment is not configured yet; skipping."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.configured.outputs.ok == 'true'
        with:
          node-version: 22
          cache: npm
      - if: steps.configured.outputs.ok == 'true'
        run: npm ci
      - if: steps.configured.outputs.ok == 'true'
        run: npx vite build
      - name: Apply database migrations
        if: steps.configured.outputs.ok == 'true'
        run: npx wrangler d1 migrations apply DB --remote
      - name: Deploy worker
        if: steps.configured.outputs.ok == 'true'
        run: npx wrangler deploy
      # Uploads the one-time setup token for creating the first administrator, if provided.
      - name: Set first-admin setup token
        if: steps.configured.outputs.ok == 'true' && env.BOOTSTRAP_TOKEN != ''
        run: printf '%s' "$BOOTSTRAP_TOKEN" | npx wrangler secret put BOOTSTRAP_TOKEN
