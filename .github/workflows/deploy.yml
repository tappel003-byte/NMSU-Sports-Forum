name: CI and deploy

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx vite build

  # Deploys main to Cloudflare once the technical owner has added the repository
  # secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID (see docs/DEPLOYMENT.md).
  # Skipped until then. Optional secrets and variables are passed to the Worker when present,
  # so everything can be configured from GitHub's settings page.
  deploy:
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      BOOTSTRAP_TOKEN: ${{ secrets.BOOTSTRAP_TOKEN }}
      VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
      CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      TURNSTILE_SECRET: ${{ secrets.TURNSTILE_SECRET }}
      VAPID_PUBLIC_KEY: ${{ vars.VAPID_PUBLIC_KEY }}
      TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
      MAIL_FROM: ${{ vars.MAIL_FROM }}
    steps:
      - uses: actions/checkout@v4
      - name: Skip when Cloudflare is not configured
        id: configured
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Cloudflare deployment is not configured yet; skipping."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.configured.outputs.ok == 'true'
        with:
          node-version: 22
          cache: npm
      - if: steps.configured.outputs.ok == 'true'
        run: npm ci
      - if: steps.configured.outputs.ok == 'true'
        run: npx vite build
      - name: Apply database migrations
        if: steps.configured.outputs.ok == 'true'
        run: npx wrangler d1 migrations apply DB --remote
      - name: Deploy worker
        if: steps.configured.outputs.ok == 'true'
        run: |
          ARGS=()
          [ -n "$VAPID_PUBLIC_KEY" ] && ARGS+=(--var "VAPID_PUBLIC_KEY:$VAPID_PUBLIC_KEY")
          [ -n "$TURNSTILE_SITE_KEY" ] && ARGS+=(--var "TURNSTILE_SITE_KEY:$TURNSTILE_SITE_KEY")
          [ -n "$MAIL_FROM" ] && ARGS+=(--var "MAIL_FROM:$MAIL_FROM")
          npx wrangler deploy "${ARGS[@]}"
      # Uploads any secrets that are set in GitHub (setup token, push, recruiting data, email, human check).
      - name: Upload Worker secrets
        # Runs even if connecting the custom domain failed, so the workers.dev site still works.
        if: always() && steps.configured.outputs.ok == 'true'
        run: |
          for NAME in BOOTSTRAP_TOKEN VAPID_PRIVATE_KEY CFBD_API_KEY RESEND_API_KEY TURNSTILE_SECRET; do
            VALUE="${!NAME}"
            if [ -n "$VALUE" ]; then printf '%s' "$VALUE" | npx wrangler secret put "$NAME"; fi
          done
